<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NOVA SWARM — a neon arena survival shooter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #game:focus-visible { outline: 2px solid #7df9ff; outline-offset: -2px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Nova Swarm: a neon arena survival shooter. Move with WASD, aim with the mouse, hold click to fire, Space to dash."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
